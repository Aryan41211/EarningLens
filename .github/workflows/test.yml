name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject (3.11) and the version the code is
        # developed and type-checked against (3.12).
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install the package the way a user would, so a broken pyproject or a
      # missing entry point fails here rather than on someone's machine.
      - run: pip install -e ".[dev,dashboard]"

      - run: pytest tests/ -v

      # mypy config has existed since 25da380 but went unenforced, so its
      # findings accumulated silently. Keep it in CI so that cannot recur.
      - run: mypy src/

      # Nothing covered scripts/: tests only import src/, and a syntax error in
      # run_all_scoring.py once passed both pytest and mypy.
      - run: python -m compileall -q scripts/

      # Every console script must at least start. Catches a bad entry point,
      # which no other check would notice.
      - run: |
          earningslens-score --list-prompts
          earningslens-ingest --dry-run
          earningslens-score --dry-run
          earningslens-aggregators --help

  # The dashboard is the deployed artifact, so the thing that deploys it has to
  # build. A Dockerfile nothing builds in CI is a Dockerfile that works until
  # the day you need it.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t earningslens:ci .

      # No secret may reach a layer. .env is gitignored, but Docker reads the
      # filesystem rather than the git index, so only .dockerignore stops it.
      - name: No API key baked into the image
        run: |
          test -z "$(docker run --rm --entrypoint sh earningslens:ci -c 'printenv LLM_API_KEY')"
          ! docker run --rm --entrypoint sh earningslens:ci -c 'test -f /app/.env'

      - name: Dashboard serves and reports healthy
        run: |
          docker run -d --name el -p 8501:8501 earningslens:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8501/_stcore/health && break
            sleep 2
          done
          curl -sf http://localhost:8501/_stcore/health
          docker rm -f el

  # The release gate. Runs on demand and on a version tag -- never on an
  # ordinary push, because it is expected to FAIL for as long as KNOWN_ISSUES.md
  # BLOCKER-6 is open, and that is the point: it makes "do not ship the
  # credibility claim" mechanical instead of a sentence in a document.
  #
  # It reads notebooks/labels.csv only, so it needs no database and reproduces
  # anywhere. Exit code 3 means at least one target in EVALUATION.md 3.2 was
  # missed or could not be measured.
  release-gate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/run_evaluation.py --dimension evasiveness --against reviewed

  # The release itself. Build and push the dashboard image to Docker Hub on a
  # version tag (or on demand), gated on the release gate passing.
  #
  # The image name is fixed: aryankondekar/earningslens -- built from this
  # project's own Dockerfile, never reusing an existing image. Only the login
  # credential is a secret.
  #   DOCKERHUB_USERNAME -- Docker Hub account owning the earningslens repo
  #   DOCKERHUB_TOKEN     -- a fine-grained write token for that repo
  #
  # The gate is deliberately a dependency: this job will not run its payload
  # until the `release-gate` job above has succeeded. While KNOWN_ISSUES.md
  # BLOCKER-6 is open the gate exits 3 and the gate job fails, so this job is
  # skipped and nothing is pushed -- the "do not ship the credibility claim"
  # rule is enforced by CI topology, not a sentence.
  image-publish:
    needs: release-gate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # One definition, available to every later step via the environment.
      # On a `v*` tag GITHUB_REF_NAME is the tag (e.g. v0.5.0); on a manual
      # dispatch it is a branch name, so fall back to the latest tag.
      - name: Define image tag
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.0.0-dev)"
            VERSION="${VERSION#v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # Build what the `image` job proved works -- publish exactly what CI
      # verified, not a fresh re-derivation.
      - name: Build image
        run: docker build -t "earningslens:${VERSION}" .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push (version + latest)
        run: |
          IMAGE="aryankondekar/earningslens"
          docker tag "earningslens:${VERSION}" "${IMAGE}:${VERSION}"
          docker tag "earningslens:${VERSION}" "${IMAGE}:latest"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
