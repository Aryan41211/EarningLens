name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: pytest tests/ -v

      # mypy.ini has existed since 25da380 but was never enforced, so its
      # findings accumulated silently. Keep it in CI so that cannot recur.
      - run: pip install mypy
      - run: mypy src/

      # Nothing covered scripts/: tests only import src/, and a syntax error in
      # run_all_scoring.py once passed both pytest and mypy. A byte-compile is
      # cheap and catches the class of break that matters for entry points.
      - run: python -m compileall -q scripts/
